<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h1>💸 <span>Expense</span></h1>
    <div class="nav-item active">Dashboard</div>
    <div class="nav-item">This Month</div>
    <div class="nav-item">Categories</div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="page-title">Dashboard</div>

    <!-- Summary -->
    <div class="summary">
      <div class="card highlight">
        <p>Total Spent</p>
        <h2 id="total-spent">₹0</h2>
      </div>
      <div class="card">
        <p>This Month</p>
        <h2 id="this-month">₹0</h2>
      </div>
      <div class="card">
        <p>Total Entries</p>
        <h2 id="total-entries">0</h2>
      </div>
    </div>

    <!-- Form -->
    <div class="form-box">
      <h3>Add Expense</h3>
      <div class="form-row">
        <input type="number" id="amount" placeholder="Amount (₹)" />
        <input type="text" id="note" placeholder="Note (e.g. Lunch)" />
        <select id="category">
          <option value="">Category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Health">Health</option>
          <option value="Education">Education</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="date" />
      </div>
      <button id="add-btn">+ Add Expense</button>
    </div>

    <!-- List -->
    <div class="list-box">
  <div class="list-header">
    <h3>Expenses</h3>
    <button id="export-btn">⬇ Export CSV</button>
  </div>
      <ul id="expense-list">
        <li class="empty-msg">No expenses yet. Add one above!</li>
      </ul>
    </div>
    <!-- Chart -->
<div class="chart-box">
  <h3>Spending by Category</h3>
  <div class="chart-wrap">
    <canvas id="categoryChart"></canvas>
  </div>
</div>

  </div>

  <script src="app.js"></script>
</body>
</html>
